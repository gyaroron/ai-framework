# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: assertive

  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false

  auto_review:
    enabled: true

  path_filters:
    - "!pnpm-lock.yaml"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!dist/**"
    - "!coverage/**"

  # 별도의 문서 없이 yaml 내부에 컨벤션 직접 명시
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: |
        - 변수는 camelCase, 상수는 SNAKE_CASE를 사용한다.
        - Boolean 변수명은 is, has, can 접두사를 사용한다.
        - 함수명은 동사로 시작하며, 이벤트 핸들러는 handle 접두사를 사용한다.
        - 타입스크립트의 any 타입 사용을 지양한다.
        - 불필요한 주석과 console.log는 PR 전에 제거한다.
        - 반복적으로 사용되는 문자열, 숫자, 경로, 상태값은 상수화 여부를 검토한다.
        - 중복 코드가 발생하면 공통 컴포넌트, 커스텀 훅 또는 유틸 함수 추출을 고려한다.

    - path: "src/components/**/*.{tsx,jsx}"
      instructions: |
        - 컴포넌트 폴더명은 camelCase를 사용하되, 파일명과 함수명은 반드시 PascalCase를 사용한다.
        - Props 타입은 '컴포넌트명 + Props' 형태의 interface로 정의한다.

    - path: "src/pages/**/*.{tsx,jsx}"
      instructions: |
        - Page 컴포넌트는 예외적으로 default export를 허용한다.

    - path: "src/hooks/**/*.ts"
      instructions: |
        - 훅(Hook) 파일명과 함수명은 모두 use 접두사를 포함한 camelCase를 사용한다.

    - path: "src/utils/**/*.ts"
      instructions: |
        - 유틸 함수 파일명과 함수명은 camelCase를 사용한다.

chat:
  auto_reply: true