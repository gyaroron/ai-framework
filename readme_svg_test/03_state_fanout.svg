<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="삭제 버튼을 누르면 handleDelete가 batch 안에서 setServerIp, setDraft, setStatus를 부르고, miniReact가 화면의 세 곳을 한 번에 바꾼다">
  <style>
    text { font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .mono { font-family: Consolas, 'D2Coding', 'JetBrains Mono', monospace; }
    .flow { stroke-dasharray: 7 7; animation: dash 0.9s linear infinite; }
    .f1 rect, .f2 rect, .f3 rect { animation: flash 8s ease-in-out infinite; }
    .f2 rect { animation-delay: .35s; } .f3 rect { animation-delay: .7s; }
    .bf { animation: before 8s ease-in-out infinite; }
    .af { animation: after 8s ease-in-out infinite; }
    @keyframes dash { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
    @keyframes flash { 0%, 30% { stroke-width: 2; } 36% { stroke-width: 7; } 44%, 100% { stroke-width: 2; } }
    @keyframes before { 0%, 44% { opacity: 1; } 50%, 94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes after { 0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bf { opacity: 0; } }
  </style>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#60a5fa"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fb923c"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="750" rx="24" fill="#0f172a"/>
  <text x="40" y="72" font-size="32" font-weight="800" fill="#f8fafc">state를 바꾸면 화면 세 곳이 한 번에 바뀝니다</text>
  <text x="40" y="110" font-size="20" fill="#cbd5e1">삭제 버튼을 누르면 handleDelete가 batch 안에서 setter 세 개를 부릅니다</text>

  <text x="40" y="164" font-size="20" font-weight="700" fill="#93c5fd">① 개발자가 쓴 코드</text>
  <text x="490" y="164" font-size="20" font-weight="700" fill="#93c5fd">② App의 state</text>
  <text x="730" y="164" font-size="20" font-weight="700" fill="#fdba74">③ 화면 (miniReact가 반영)</text>

  <rect x="30" y="182" width="410" height="446" rx="14" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="mono" x="48" y="216" font-size="20" fill="#93c5fd">batch(() =&gt; {</text>
  <text class="mono" x="48" y="612" font-size="20" fill="#93c5fd">});</text>

  <g class="f1">
    <rect x="60" y="236" width="360" height="84" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <rect x="60" y="346" width="360" height="84" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <rect x="60" y="456" width="360" height="84" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text class="mono" x="78" y="285" font-size="20" fill="#e2e8f0">setServerIp("(값 없음)");</text>
  <text class="mono" x="78" y="395" font-size="20" fill="#e2e8f0">setDraft("");</text>
  <text class="mono" x="78" y="505" font-size="20" fill="#e2e8f0">setStatus("…했습니다.");</text>

  <line class="flow" x1="420" y1="278" x2="482" y2="278" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>
  <line class="flow" x1="420" y1="388" x2="482" y2="388" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>
  <line class="flow" x1="420" y1="498" x2="482" y2="498" stroke="#60a5fa" stroke-width="3" marker-end="url(#ab)"/>

  <g class="f2">
    <rect x="490" y="236" width="180" height="84" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <rect x="490" y="346" width="180" height="84" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
    <rect x="490" y="456" width="180" height="84" rx="12" fill="#172f52" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text class="mono" x="580" y="286" font-size="24" font-weight="700" fill="#bfdbfe" text-anchor="middle">serverIp</text>
  <text class="mono" x="580" y="396" font-size="24" font-weight="700" fill="#bfdbfe" text-anchor="middle">draft</text>
  <text class="mono" x="580" y="506" font-size="24" font-weight="700" fill="#bfdbfe" text-anchor="middle">status</text>

  <line class="flow" x1="670" y1="278" x2="722" y2="278" stroke="#fb923c" stroke-width="3" marker-end="url(#ao)"/>
  <line class="flow" x1="670" y1="388" x2="722" y2="388" stroke="#fb923c" stroke-width="3" marker-end="url(#ao)"/>
  <line class="flow" x1="670" y1="498" x2="722" y2="498" stroke="#fb923c" stroke-width="3" marker-end="url(#ao)"/>

  <g class="f3">
    <rect x="730" y="236" width="440" height="84" rx="12" fill="#3b2410" stroke="#fb923c" stroke-width="2"/>
    <rect x="730" y="346" width="440" height="84" rx="12" fill="#3b2410" stroke="#fb923c" stroke-width="2"/>
    <rect x="730" y="456" width="440" height="84" rx="12" fill="#3b2410" stroke="#fb923c" stroke-width="2"/>
  </g>
  <text x="748" y="268" font-size="20" font-weight="700" fill="#fdba74">ServerIpValue</text>
  <text class="bf" x="748" y="302" font-size="20" fill="#fff7ed">현재 저장 값: 10.0.0.7</text>
  <text class="af" x="748" y="302" font-size="20" fill="#fff7ed">현재 저장 값: (값 없음)</text>

  <text x="748" y="378" font-size="20" font-weight="700" fill="#fdba74">ServerIpForm의 입력 칸</text>
  <text class="bf mono" x="748" y="412" font-size="20" fill="#fff7ed">10.0.0.7</text>
  <text class="af" x="748" y="412" font-size="20" fill="#d6b99a">(빈 칸)</text>

  <text x="748" y="488" font-size="20" font-weight="700" fill="#fdba74">StatusMessage</text>
  <text class="bf" x="748" y="522" font-size="20" fill="#fff7ed">Redis 캐시에서 읽었습니다.</text>
  <text class="af" x="748" y="522" font-size="20" fill="#fff7ed">…Redis 캐시를 무효화했습니다.</text>

  <text x="40" y="678" font-size="22" fill="#f8fafc">개발자는 DOM 요소를 찾지 않습니다. batch가 세 변경을 묶어 화면을 한 번만 다시 그립니다.</text>
  <text x="40" y="716" font-size="20" fill="#94a3b8">10.0.0.7은 설명을 위한 예시 값입니다.</text>
</svg>
