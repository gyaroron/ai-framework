<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="miniReact 구조: 브라우저의 이벤트가 component.js, vdom.js, diff.js, patch.js 를 차례로 거쳐 다시 브라우저의 DOM 에 반영된다. lis.js 와 fenwick.js 는 diff.js 를 돕고, history.js 는 patch.js 를 쓰며, tests 와 move 는 개발 시점에 라이브러리를 검사하고 측정한다">
  <style>
    text { font-family: Geist, Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'D2Coding', monospace; letter-spacing: .02em; }
    .e { stroke: #5e9cf5; stroke-width: 3; fill: none; }
    .n { stroke: #a9aeb8; stroke-width: 2.4; fill: none; }
    .dash { stroke-dasharray: 7 8; animation: dash 1.2s linear infinite; }
    .el { font-family: 'JetBrains Mono', Consolas, 'D2Coding', monospace; font-size: 17px; fill: #a9aeb8; paint-order: stroke; stroke: #111419; stroke-width: 7px; stroke-linejoin: round; }
    .el.a { fill: #5e9cf5; }
    .hl { fill: none; stroke: #5e9cf5; stroke-width: 6; opacity: 0; animation: hl 9s linear infinite; }
    .h1 { animation-delay: 1.17s; } .h2 { animation-delay: 2.17s; } .h3 { animation-delay: 3.18s; } .h4 { animation-delay: 4.18s; }
    @keyframes dash { from { stroke-dashoffset: 15; } to { stroke-dashoffset: 0; } }
    @keyframes hl { 0% { opacity: 0; } 2%, 9% { opacity: 1; } 14%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
